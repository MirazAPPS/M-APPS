name: Build Android APK and Extract Zip

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract Zip File
      run: |
        echo "Extracting m-apps.zip..."
        mkdir -p extracted_project
        unzip -q m-apps.zip -d extracted_project
        
        find extracted_project -name "gradlew" -delete
        find extracted_project -type d -name "wrapper" -exec rm -rf {} +

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Gradle Wrapper
      run: |
        cd extracted_project
        PROJECT_DIR=$(find . -name "build.gradle" -o -name "build.gradle.kts" -maxdepth 3 | xargs dirname | head -n 1)
        echo "Found project directory: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        gradle wrapper
        chmod +x gradlew
        
        # ডিপেন্ডেন্সি রেজোলিউশন ত্রুটি এড়াতে অতিরিক্ত জেভিএম অপশনসহ বিল্ড রান করছি
        ./gradlew assembleDebug -Dorg.gradle.project.android.aapt2FromMavenOverride=""
        
