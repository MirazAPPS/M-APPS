name: Build Android APK and Extract Zip

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract Zip File
      run: |
        echo "Extracting m-apps.zip..."
        mkdir -p extracted_project
        unzip -q m-apps.zip -d extracted_project
        ls -la extracted_project

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Gradle Wrapper
      run: |
        cd extracted_project
        PROJECT_DIR=$(find . -name "build.gradle" -o -name "build.gradle.kts" -maxdepth 3 | xargs dirname | head -n 1)
        echo "Found project directory: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # যদি gradlew না থাকে তবে প্রজেক্টের ভেতরে নতুন র‍্যাপার ইনিট করে নেব
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: napps-telecom-apk
        path: "**/build/outputs/apk/debug/*.apk"
        
